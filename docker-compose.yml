services:
  app:
    build: .
    # network_mode: host gives the container direct access to the host's
    # network stack, including Tailscale.  This is required so the server
    # can reach runner agents on other Tailscale nodes.
    # The "ports" directive is ignored under host networking — the app
    # binds to PORT on the host directly.
    network_mode: host
    volumes:
      - db-data:/app/data
      # Mount the directory, not the bare .db file: SQLite WAL mode keeps
      # -wal/-shm sidecar files next to the db, and a single-file bind mount
      # goes stale if the source file is ever replaced.
      # In Settings, the Maldev database path must be the CONTAINER path:
      # /maldev/elearning.db
      # :z relabels for SELinux (Fedora blocks container reads of bind
      # mounts without it — shows up as EACCES despite correct file modes).
      - /home/mskn/maldev:/maldev:ro,z
    environment:
      - DATABASE_PATH=/app/data/learner.db
      # Listen on the Tailscale interface only, port 3001.
      - HOSTNAME=100.66.34.21
      - PORT=3001
      # Shared secret for runner agents. Generate your own:
      #   head -c 32 /dev/urandom | base64 | tr -d '/+=' | head -c 32
      # Use the same value when starting each runner (--token flag).
      - RUNNER_TOKEN=${RUNNER_TOKEN:?Set RUNNER_TOKEN in .env or export it}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:
