th="1.8"/><path d="M141 48.5L136 53L141 57.5" fill="none" stroke="#98968d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="158" y="58" font-family="Archivo" font-size="14" fill="#98968d">All competencies</text><rect x="990" y="42" width="108" height="30" rx="8" fill="#242320"/><text x="1004" y="62" font-family="JetBrains Mono" font-size="10" fill="#c2c0b8" letter-spacing="1">EXPORT</text><rect x="1108" y="42" width="40" height="30" rx="8" fill="#242320"/><path d="M1120 52h6v6M1136 62h-6v-6" fill="none" stroke="#c2c0b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="136" y="88" width="140.0" height="22" rx="9" fill="#242320"/><text x="146" y="102.6" font-family="JetBrains Mono" font-size="10" fill="#c2c0b8">L2 · Detailed course</text><rect x="284.0" y="88" width="158.0" height="22" rx="9" fill="#242320"/><text x="294.0" y="102.6" font-family="JetBrains Mono" font-size="10" fill="#c2c0b8">Networking fundamentals</text><text x="136" y="154" font-family="DM Serif Display" font-size="32" fill="#f7f3ea">Network Scanning Deep Dive</text><line x1="136" y1="178" x2="796" y2="178" stroke="#35342f" stroke-width="1"/><text x="136" y="208" font-family="Archivo" font-size="21" fill="#f7f3ea" font-weight="700">Host discovery techniques</text><text x="136" y="234.0" font-family="Archivo" font-size="15" fill="#c2c0b8">Nmap provides several host discovery methods. On a local segment ARP is both faster and</text><text x="136" y="257.25" font-family="Archivo" font-size="15" fill="#c2c0b8">harder to filter; across a routed boundary you fall back to ICMP and TCP probes.</text><rect x="133" y="279.5" width="280.7" height="24" rx="3" fill="#2a2620"/><text x="136" y="294.5" font-family="Archivo" font-size="15" fill="#c2c0b8">ARP scan is faster on local networks</text><line x1="136" y1="299.5" x2="408.7" y2="299.5" stroke="#d7c19c" stroke-width="1.4"/><rect x="136" y="328.5" width="660" height="128" rx="14" fill="#1d1c19" stroke="#3534